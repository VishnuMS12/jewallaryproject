<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Edit Jewellary Ornaments</h1>
<div class="row">
                                            <div class="col-sm-12">
                                                <!-- Basic Form Inputs card start -->
                                                <div class="card">
                                                    <div class="card-header">
                                                        <h5>Basic Form Inputs</h5>
                                                        <span>Add class of <code>.form-control</code> with <code>&lt;input&gt;</code> tag</span>
                                                    </div>
                                                    <div class="card-block">
                                                        <h4 class="sub-title">Basic Inputs</h4>
                                                        <form method="POST" action="{% url 'editornaments' orn_id=data.id %}"  enctype="multipart/form-data">
                                                            {% csrf_token %}
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Category Name</label>
                                                                <div class="col-sm-10">
                                                                    <input type="text" class="form-control" name="Category_Name" value="{{data.Category_Name}}">
                                                                </div>
                                                            </div>
                                                             <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Product Name</label>
                                                                <div class="col-sm-10">
                                                                    <input type="text" class="form-control" name="Product_Name" value="{{data.Product_Name}}">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Price</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Number" class="form-control" name="Price" value="{{data.Price}}">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Description</label>
                                                                <div class="col-sm-10">
                                                                    <textarea rows="5" cols="5" class="form-control" placeholder="Default textarea" name="Description">{{data.Description}}</textarea>
                                                                </div>
                                                            </div>
                                                             <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Weight</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="Weight" value="{{data.Weight}}">
                                                                </div>
                                                            </div>
                                                               <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Item_gross_weight</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="Item_gross_weight" value="{{data.Item_gross_weight}}">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Item_net_weight</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="Item_net_weight" value="{{data.Item_net_weight}}">
                                                                </div>
                                                            </div>
                                                             <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Chain_length</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="Chain_length" value="{{data.Chain_length}}">
                                                                </div>
                                                            </div>
                                                               <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Diameter</label>
                                                                <div class="col-sm-10">
                                                                    <input type="Text" class="form-control" name="Diameter" value="{{data.Diameter}}">
                                                                </div>
                                                            </div>

                                                            <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Ornaments_img1</label>
                                                                <div class="col-sm-10">
                                                                    <input type="file" class="form-control" name="Ornaments_img1" ><img src="{{data.Ornaments_img1.url}}" style="width:80px;height:80px;">
                                                                </div>
                                                            </div>
                                                              <div class="form-group row">
                                                                <label class="col-sm-2 col-form-label">Ornaments_img2</label>
                                                                <div class="col-sm-10">
                                                                    <input type="file" class="form-control" name="Ornaments_img2" ><img src="{{data.Ornaments_img2.url}}" style="width:80px;height:80px;">
                                                                </div>
                                                            </div>
                                                             <button class="btn btn-danger waves-effect waves-light" type="submit">UPDATE</button>
                                                        </form>

                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <!-- Basic Form Inputs card end -->
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Page body end -->
                                </div>
                            </div>
</body>
</html>
   {% endblock %}
