<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Display Categories</h1>
 <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Category_Name </th>
                            <th> Product_Name </th>
                            <th> price </th>
                            <th>Description </th>
                            <th> Cat_img </th>
                            <th> Action </th>
                          </tr>
                          {% for d in data %}
                        <tr>
                            <td>{{d.Category_Name}}</td>
                            <td>{{d.Product_Name}}</td>
                            <td>{{d.Price}}</td>
                            <td>{{d.Description}}</td>
                            <td><img src="{{d.Cat_img.url}}" style="width:80px;height:80px;" ></td>
                            <td>
                                <a href="{% url 'editcatego' cat_id=d.id %}"><button>Edit</button></a>
                            <a href="{% url 'delcate' cat_id=d.id %}"><button>Delete</button></a>
                            </td>

                        </tr>
                        {% endfor %}
                        </thead>
                        <tbody>
</body>
</html>
{% endblock %}
