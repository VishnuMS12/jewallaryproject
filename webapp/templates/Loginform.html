<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Login Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#1e3c72,#2a5298,#6a11cb,#2575fc);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:200px;
    height:200px;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:150px;
    height:150px;
    bottom:10%;
    right:15%;
    animation-duration:10s;
}

.circle:nth-child(3){
    width:100px;
    height:100px;
    top:70%;
    left:20%;
    animation-duration:7s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-30px);
    }
}

/* Form */

.container{
    width:360px;
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:popup 1s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.container h2{
    color:white;
    text-align:center;
    margin-bottom:30px;
    font-size:30px;
}

.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:30px;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:16px;
    transition:.4s;
}

.input-box input::placeholder{
    color:#ddd;
}

.input-box input:focus{
    background:white;
    color:#333;
    box-shadow:0 0 20px #00f7ff;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#00f7ff,#0072ff);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
    font-weight:bold;
}

button:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,247,255,.5);
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:white;
    text-decoration:none;
    transition:.3s;
}

.links a:hover{
    color:#00f7ff;
}

</style>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">

<h2>Welcome</h2>

<form method="POST" action="{% url 'userlogin' %}">
    {% csrf_token %}
    
<div class="input-box">
<input type="text" placeholder="Username"  name="username" >
</div>

<div class="input-box">
<input type="number" placeholder="password"  name="password" >
</div>


<button type="submit">Login</button>

<div class="links">
<br>
<a href="#">Forgot Password?</a><br><br>
<a href="{% url 'userregister' %}">Create New Account</a>
</div>

</form>

</div>

</body>
</html>
